apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-dbless-config
  namespace: finance
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    services:
      - name: user-service
        url: http://user-service:8080
        routes:
          - name: users
            paths:
              - /users
      - name: order-service
        url: http://order-service:8080
        routes:
          - name: orders
            paths:
              - /orders
      - name: payment-service
        url: http://payment-service:8080
        routes:
          - name: payments
            paths:
              - /payments
      - name: inventory-service
        url: http://inventory-service:8080
        routes:
          - name: inventory
            paths:
              - /inventory
      - name: notification-service
        url: http://notification-service:8080
        routes:
          - name: notifications
            paths:
              - /notifications
      - name: ai-service
        url: http://ai-service:80
        routes:
          - name: ai
            paths:
              - /ai
              - /mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.6
          ports:
            - containerPort: 8000
            - containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          volumeMounts:
            - name: config
              mountPath: /kong
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: config
          configMap:
            name: kong-dbless-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: finance
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 80
      targetPort: 8000
    - name: admin
      port: 8001
      targetPort: 8001
