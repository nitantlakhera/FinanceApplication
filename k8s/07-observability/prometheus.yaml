apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: finance
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'user-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['user-service:8080']
      - job_name: 'order-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-service:8080']
      - job_name: 'payment-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['payment-service:8080']
      - job_name: 'inventory-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['inventory-service:8080']
      - job_name: 'notification-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8080']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          ports:
            - containerPort: 9090
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: finance
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
